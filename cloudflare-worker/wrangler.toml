name            = "nokasa-tracker"
main            = "worker.js"
compatibility_date = "2024-09-23"

# ─── Plain env vars (non-secret) ───────────────────────────────
[vars]
# Paste your Apps Script exec URL here after deploying the script
APPS_SCRIPT_URL = "https://script.google.com/macros/s/REPLACE_WITH_YOUR_DEPLOYMENT_ID/exec"

# ─── Secret (set via CLI, never commit to git) ─────────────────
# Run:  wrangler secret put PASSWORD
# Then type your chosen password when prompted.
# The PASSWORD var is referenced as env.PASSWORD inside the worker.
